name: challsmith

# Explicitly empty proxy vars: the docker CLI "proxies" client config would otherwise inject them.
x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  NO_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  all_proxy: ""

services:
  ctfd:
    build:
      context: ./ctfd
      # predefined proxy build args: used by RUN (git clone, pip) but not kept in the image
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    image: challsmith/ctfd:3.8.9-cm0.10.1
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:8000
    environment:
      <<: *no-proxy
      DATABASE_URL: mysql+pymysql://ctfd:${CTFD_DB_PASSWORD}@ctfd-db/ctfd
      REDIS_URL: redis://ctfd-redis:6379
      SECRET_KEY: ${CTFD_SECRET_KEY}
      PLUGIN_SETTINGS_CM_API_URL: http://chall-manager:8080
      PLUGIN_SETTINGS_CM_MANA_TOTAL: ${CM_MANA_TOTAL:-5}
    volumes:
      - ctfd-uploads:/var/uploads
    depends_on:
      ctfd-db:
        condition: service_healthy
      ctfd-redis:
        condition: service_started
      chall-manager:
        condition: service_started
    healthcheck:
      test: python3 -c 'import requests; requests.get("http://localhost:8000").raise_for_status()'
      start_period: 120s
      interval: 10s
      retries: 3
      timeout: 10s

  ctfd-db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      <<: *no-proxy
      MARIADB_ROOT_PASSWORD: ${CTFD_DB_PASSWORD}
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD}
    volumes:
      - ctfd-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  ctfd-redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    environment: *no-proxy

  ctfd-setup:
    image: ctferio/ctfd-setup:v1.8.6
    restart: "no"
    environment:
      <<: *no-proxy
      URL: http://ctfd:8000
      FILE: /ctfd-setup.yaml
    volumes:
      - ./ctfd/setup.yaml:/ctfd-setup.yaml:ro
    depends_on:
      ctfd:
        condition: service_healthy

  chall-manager:
    image: ctferio/chall-manager:v0.6.7
    restart: unless-stopped
    environment:
      <<: *no-proxy
      OCI_INSECURE: "true"
      DIR: /var/lib/chall-manager
      PULUMI_HOME: /var/lib/pulumi
      PULUMI_BACKEND_URL: file:///var/lib/pulumi  # local state, no Pulumi Cloud login
    volumes:
      - cm-state:/var/lib/chall-manager
      - cm-pulumi:/var/lib/pulumi
      - /var/run/docker.sock:/var/run/docker.sock

  chall-manager-janitor:
    image: ctferio/chall-manager-janitor:v0.6.7
    restart: unless-stopped
    environment:
      <<: *no-proxy
      URL: chall-manager:8080
      TICKER: 1m
    depends_on:
      - chall-manager

  registry:
    image: registry:3
    restart: unless-stopped
    environment: *no-proxy
    ports:
      - 127.0.0.1:5000:5000
    volumes:
      - registry:/var/lib/registry

  app-db:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      <<: *no-proxy
      POSTGRES_USER: challsmith
      POSTGRES_DB: challsmith
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - app-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U challsmith -d challsmith"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
      # predefined proxy build args: used by RUN (apk, pip) but not kept in the image
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    image: challsmith/api:0.1.0
    restart: unless-stopped
    environment:
      <<: *no-proxy
      DATABASE_URL: postgresql+psycopg://challsmith:${APP_DB_PASSWORD}@app-db/challsmith
      WEB_ADMIN_USER: ${WEB_ADMIN_USER:-admin}
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD}
      CTFD_URL: http://ctfd:8000
      CTFD_ADMIN_NAME: ${CTFD_ADMIN_NAME}
      CTFD_ADMIN_PASSWORD: ${CTFD_ADMIN_PASSWORD}
      CHALL_MANAGER_URL: http://chall-manager:8080
      REGISTRY_PREFIX: localhost:5000/challsmith
      SCENARIO_SINGLE: registry:5000/challsmith/scenarios/single:v1
      SCENARIO_MULTI: registry:5000/challsmith/scenarios/multi:v1
      TEMPLATES_DIR: /app/templates
      DATA_DIR: /var/lib/challsmith
      # company proxy: only for challenge docker builds and git, never for service containers
      UPSTREAM_HTTP_PROXY: ${HTTP_PROXY:-}
      UPSTREAM_HTTPS_PROXY: ${HTTPS_PROXY:-}
      UPSTREAM_NO_PROXY: ${NO_PROXY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app-data:/var/lib/challsmith
    depends_on:
      app-db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      # predefined proxy build args: used by npm but not kept in the image
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    image: challsmith/web:0.1.0
    restart: unless-stopped
    environment:
      <<: *no-proxy
      API_URL: http://api:8000
      # Host header allow-list (DNS-rebinding guard); add the VM hostname here when reaching it remotely
      ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - api

volumes:
  app-db:
  app-data:
  ctfd-uploads:
  ctfd-db:
  cm-state:
  cm-pulumi:
  registry:
