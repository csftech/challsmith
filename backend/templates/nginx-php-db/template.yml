description: nginx, PHP-FPM and MariaDB, three containers
scenario: multi
protocol: http
instance:
  memory: 512m
services:
  - name: web
    port: 80
    entry: true
  - name: php
    env:
      DB_PASSWORD: change-me
  - name: db
    image: mariadb:11.8
    env:
      MARIADB_ROOT_PASSWORD: change-me
      MARIADB_DATABASE: app
