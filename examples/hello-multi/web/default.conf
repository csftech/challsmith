server {
    listen 80;
    # Resolve app at request time so nginx starts even before the app container exists.
    resolver 127.0.0.11 valid=10s;
    set $app app:9000;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/index.php;
        fastcgi_pass $app;
    }
}
