<h2>再多幾種方向：哪一張比較接近你要的感覺？</h2>
<p class="subtitle">這次做得比較完整：搜尋列、篩選、表頭、圖示、操作按鈕都有，比較能看出實際的樣子。內容一樣是真實資料，依分類分組，⠿ 是拖拉把手。點一下就能選擇，也可以告訴我「D 的版面配 E 的顏色」這類組合。</p>

<div class="options" id="opts"></div>

<script>
const I = {
  grid: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  list: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  flag: '<svg viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 1-1h11l-2 4 2 4H5"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  git: '<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-11 6"/></svg>',
  broom: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  moon: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  grip: '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  side: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>',
};
const rows = [
  { cat: "Web", items: [["78","PHP-01","php-01","web",100,"pub","已發佈","2 小時前"],["151","hello-php","hello-php","web",100,"pub","已發佈","昨天"]] },
  { cat: "Pwn", items: [["—","tcp-echo","tcp-echo","pwn",200,"dr","未發佈","3 天前"]] },
];
function shot(k) {
  let t = "";
  rows.forEach(g => {
    t += `<div class="cat"><span class="grip">${I.grip}</span>${I.chev}${g.cat}<span style="opacity:.5;font-weight:400">${g.items.length}</span></div>`;
    g.items.forEach(r => t += `<div class="tr"><span class="grip">${I.grip}</span><span class="id">${r[0]}</span><span class="name">${r[1]}<span class="slug">${r[2]}</span></span><span class="chip ${r[3]}">${r[3]==="web"?"Web":"Pwn"}</span><span class="num">${r[4]}</span><span class="badge ${r[5]}"><span class="dot"></span>${r[6]}</span><span style="opacity:.6">${r[7]}</span><span class="acts"><span>${I.edit}</span><span>${I.up}</span><span>${I.trash}</span></span></div>`);
  });
  return `<div class="m ${k}">
    <div class="side">
      <div class="brand"><span class="logo">cs</span>challsmith</div>
      <div class="grp">出題</div>
      <div class="nav on">${I.flag}題目</div><div class="nav">${I.plus}新增題目</div>
      <div class="grp">系統</div>
      <div class="nav">${I.git}Git 同步</div><div class="nav">${I.broom}發佈前清理</div>
      <div class="foot"><span class="av">A</span>aps</div>
    </div>
    <div class="main">
      <div class="top"><span class="ib">${I.side}</span><span class="crumb">題目</span>
        <span class="search">${I.search}搜尋題目<span style="flex:1"></span><span class="kbd">/</span></span>
        <span class="ib">${I.globe}</span><span class="ib">${I.moon}</span></div>
      <div class="body"><div class="panel">
        <div class="bar"><span class="sel">全部分類 ${I.chev}</span><span class="sel">全部狀態 ${I.chev}</span><span class="cnt">3 題 · 2 已發佈</span>
          <span class="seg"><span class="on">${I.list}</span><span>${I.grid}</span></span><span class="btn">${I.plus}新增題目</span></div>
        <div class="thead"><span></span><span>ID</span><span>名稱</span><span>分類</span><span class="num">分數</span><span>狀態</span><span>更新</span><span style="text-align:right">操作</span></div>
        ${t}
      </div></div>
    </div></div>`;
}
const opts = [
  ["d","D","中性灰階，貼近參考圖","鋅灰色系、白底、細邊框，帶點陰影的分段切換。跟參考圖同一類的現代 SaaS 風，最穩，也最不容易看膩。"],
  ["e","E","近黑深色，冷藍重點","像 Linear 那種深色工作台：近黑底、低對比邊框、藍色主按鈕。專業感強，長時間盯著螢幕比較不累。"],
  ["f","F","淡色畫布上的浮動面板","淡藍灰底，側欄和內容是兩塊白色圓角面板，分類用不同顏色的標籤區分。比 D 柔和、有層次。"],
  ["g","G","工程感，直角與等寬數字","米白底、黑色粗框線、直角、等寬字體的數字與表頭，只用一個訊號黃。很有辨識度，完全不像範本。"],
];
document.getElementById("opts").innerHTML = opts.map(o => `<div class="option" data-choice="${o[0]}" onclick="toggleSelect(this)"><div class="letter">${o[1]}</div><div class="content" style="width:100%"><h3>${o[2]}</h3><p>${o[3]}</p>${shot(o[1])}</div></div>`).join("");
</script>
